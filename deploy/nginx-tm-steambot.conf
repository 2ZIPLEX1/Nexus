# nginx для веб-панели TM Steam Bot.
#
# Схема: интернет → nginx (TLS, 443) → uvicorn на 127.0.0.1:8000.
# Сам API наружу не смотрит — он биндится на localhost (см. web/api.py).
#
# Установка:
#   sudo cp deploy/nginx-tm-steambot.conf /etc/nginx/sites-available/tm-steambot
#   sudo ln -s /etc/nginx/sites-available/tm-steambot /etc/nginx/sites-enabled/
#   # подставьте свой домен вместо bot.example.com (две строки server_name)
#   sudo certbot --nginx -d bot.example.com     # выпустит сертификат и пропишет пути
#   sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО: домен обязателен. По голому IP сертификат Let's Encrypt не выпустить,
# а без TLS пароль от панели уходит по сети открытым текстом.

# Зоны лимитов объявляются на уровне http{}. Если этот файл подключается из
# sites-enabled (внутри http{}), строки ниже работают как есть.
limit_req_zone $binary_remote_addr zone=tmbot_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=tmbot_api:10m rate=20r/s;

# --- HTTP: только редирект на HTTPS ----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;

    # certbot складывает сюда проверочные файлы
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.example.com;

    # Пути пропишет certbot --nginx
    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Не выдавать версию nginx
    server_tokens off;

    # POST /api/config — единственное «тяжёлое» тело; 256 КБ хватает с запасом
    # и совпадает с лимитом в самом приложении.
    client_max_body_size 256k;

    # Логи. Панель сама токены в query не передаёт (WebSocket ходит по
    # одноразовому тикету), но лишнего не пишем.
    access_log /var/log/nginx/tm-steambot.access.log;
    error_log  /var/log/nginx/tm-steambot.error.log warn;

    # --- Форма входа: жёсткий лимит на перебор пароля -----------------------
    # В приложении лимит тоже есть (5 попыток / 15 мин), это второй рубеж.
    location = /api/login {
        limit_req zone=tmbot_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket live-состояния -------------------------------------------
    location = /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Соединение долгоживущее — не рвём по таймауту чтения.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Остальной API ------------------------------------------------------
    location /api/ {
        limit_req zone=tmbot_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Фронтенд (Next.js на 127.0.0.1:3000) -------------------------------
    # Если фронт собран статикой — замените на root/try_files.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
